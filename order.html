<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Place Order - UDARASA SPICES PRODUCTS</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #faf5e9;
  color: #333;
  padding: 25px 15px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  color: #a91f24;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: 2px;
}

.tagline {
  margin-top: 10px;
  color: #555;
  font-size: 17px;
  letter-spacing: 4px;
}

.order-box {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 30px 25px;
  border-radius: 25px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
  color: #a91f24;
  margin-bottom: 30px;
  font-size: 36px;
}

label {
  display: block;
  font-size: 18px;
  font-weight: bold;
  margin: 18px 0 8px;
}

select,
input,
textarea {
  width: 100%;
  padding: 15px;
  border: 2px solid #ddd;
  border-radius: 12px;
  font-size: 17px;
  background: white;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.add-btn {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: none;
  border-radius: 30px;
  background: #a91f24;
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.add-btn:hover {
  background: #87191d;
}

.cart-box {
  margin-top: 25px;
  padding: 20px;
  background: #faf5e9;
  border-radius: 15px;
}

.cart-box h2 {
  color: #a91f24;
  margin-bottom: 15px;
}

.cart-item {
  background: white;
  padding: 14px;
  margin-bottom: 10px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.remove-btn {
  border: none;
  background: #ddd;
  color: #333;
  padding: 7px 12px;
  border-radius: 8px;
  cursor: pointer;
}

.whatsapp-btn {
  width: 100%;
  margin-top: 25px;
  padding: 18px;
  border: none;
  border-radius: 30px;
  background: #25D366;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.back-btn {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #a91f24;
  text-decoration: none;
  font-weight: bold;
}

@media (max-width: 600px) {

  body {
    padding: 18px 12px;
  }

  .logo {
    font-size: 28px;
    line-height: 1.3;
  }

  .tagline {
    font-size: 14px;
    letter-spacing: 3px;
  }

  .order-box {
    padding: 25px 18px;
  }

  h1 {
    font-size: 30px;
  }

  .cart-item {
    flex-direction: column;
    align-items: flex-start;
  }

}
</style>
</head>

<body>

<div class="header">
  <div class="logo">UDARASA SPICES PRODUCTS</div>
  <div class="tagline">PURE SPICES • PURE LIFE</div>
</div>

<div class="order-box">

<h1>Place Your Order</h1>

<div class="cart-box">

<h2>Your Order</h2>

<div id="cart">
  <p>No products added yet.</p>
</div>

</div>

<label>Your Name / නම</label>
<input type="text" id="name" placeholder="Enter your name">

<label>Phone Number / දුරකථන අංකය</label>
<input type="tel" id="phone" placeholder="Enter your phone number">

<label>Delivery Address / බෙදාහැරීමේ ලිපිනය</label>
<textarea id="address" placeholder="Enter your delivery address"></textarea>

<button class="whatsapp-btn" onclick="placeOrder()">
  📲 Place Order on WhatsApp
</button>

<a href="index.html" class="back-btn">
  ← Back to Products
</a>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("udarasaCart")) || [];

displayCart();

function displayCart() {

  const cartDiv = document.getElementById("cart");

  if (cart.length === 0) {
    cartDiv.innerHTML = "<p>No products added yet.</p>";
    return;
  }

  cartDiv.innerHTML = "";

  let total = 0;

  cart.forEach((item, index) => {

    const itemPrice =
      Number(item.price || 0) * Number(item.quantity || 1);

    total += itemPrice;

    const div = document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `
      <div>
        <strong>${item.product}</strong><br>
        Size: ${item.size} × ${item.quantity}<br>
        Price: Rs. ${itemPrice.toLocaleString()}
      </div>

      <button class="remove-btn" onclick="removeItem(${index})">
        Remove
      </button>
    `;

    cartDiv.appendChild(div);
  });

  const totalDiv = document.createElement("div");

  totalDiv.innerHTML = `
    <strong style="font-size:20px;">
      Total: Rs. ${total.toLocaleString()}
    </strong>
  `;

  totalDiv.style.marginTop = "20px";

  cartDiv.appendChild(totalDiv);
}

function removeItem(index) {

  cart.splice(index, 1);

  localStorage.setItem("udarasaCart", JSON.stringify(cart));

  displayCart();
}

function placeOrder() {

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();

  if (cart.length === 0) {
    alert("Please add at least one product.");
    return;
  }

  if (!name || !phone || !address) {
    alert("Please fill in your name, phone number and delivery address.");
    return;
  }

  let total = 0;

  let message =
    "UDARASA SPICES PRODUCTS - NEW ORDER\n\n";

  cart.forEach((item, index) => {

    const itemPrice =
      Number(item.price || 0) * Number(item.quantity || 1);

    total += itemPrice;

    message +=
      (index + 1) + ". " + item.product + "\n" +
      "Size: " + item.size + "\n" +
      "Quantity: " + item.quantity + "\n" +
      "Price: Rs. " + itemPrice.toLocaleString() + "\n\n";

  });

  message +=
    "TOTAL: Rs. " + total.toLocaleString() + "\n\n" +
    "Customer Name: " + name + "\n" +
    "Phone: " + phone + "\n" +
    "Delivery Address: " + address;

  const whatsappNumber = "94704112222";

  const whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  window.location.href = whatsappURL;
}

</script>

</body>
</html>
