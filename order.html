<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Place Order - UDARASA SPICES PRODUCTS</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #faf5e9;
  color: #333;
  padding: 25px 15px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  color: #a91f24;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: 2px;
}

.tagline {
  margin-top: 10px;
  color: #555;
  font-size: 17px;
  letter-spacing: 4px;
}

.order-box {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 30px 25px;
  border-radius: 25px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
  color: #a91f24;
  margin-bottom: 30px;
  font-size: 36px;
}

label {
  display: block;
  font-size: 18px;
  font-weight: bold;
  margin: 18px 0 8px;
}

select,
input,
textarea {
  width: 100%;
  padding: 15px;
  border: 2px solid #ddd;
  border-radius: 12px;
  font-size: 17px;
  background: white;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.add-btn {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: none;
  border-radius: 30px;
  background: #a91f24;
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.add-btn:hover {
  background: #87191d;
}

.cart-box {
  margin-top: 25px;
  padding: 20px;
  background: #faf5e9;
  border-radius: 15px;
}

.cart-box h2 {
  color: #a91f24;
  margin-bottom: 15px;
}

.cart-item {
  background: white;
  padding: 14px;
  margin-bottom: 10px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.remove-btn {
  border: none;
  background: #ddd;
  color: #333;
  padding: 7px 12px;
  border-radius: 8px;
  cursor: pointer;
}

.whatsapp-btn {
  width: 100%;
  margin-top: 25px;
  padding: 18px;
  border: none;
  border-radius: 30px;
  background: #25D366;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.back-btn {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #a91f24;
  text-decoration: none;
  font-weight: bold;
}

@media (max-width: 600px) {

  body {
    padding: 18px 12px;
  }

  .logo {
    font-size: 28px;
    line-height: 1.3;
  }

  .tagline {
    font-size: 14px;
    letter-spacing: 3px;
  }

  .order-box {
    padding: 25px 18px;
  }

  h1 {
    font-size: 30px;
  }

  .cart-item {
    flex-direction: column;
    align-items: flex-start;
  }

}
</style>
</head>

<body>

<div class="header">
  <div class="logo">UDARASA SPICES PRODUCTS</div>
  <div class="tagline">PURE SPICES • PURE LIFE</div>
</div>

<div class="order-box">

<h1>Place Your Order</h1>

<label>Product / නිෂ්පාදනය</label>

<select id="product">
  <option value="">Select Product</option>
  <option value="මිරිස් කුඩු - Chilli Powder">මිරිස් කුඩු — Chilli Powder</option>
  <option value="කැලි මිරිස් - Dried Chilli">කැලි මිරිස් — Dried Chilli</option>
  <option value="බැදපු මිරිස් - Roasted Chilli">බැදපු මිරිස් — Roasted Chilli</option>
  <option value="කහ කුඩු - Turmeric Powder">කහ කුඩු — Turmeric Powder</option>
  <option value="ගම්මිරිස් කුඩු - Pepper Powder">ගම්මිරිස් කුඩු — Pepper Powder</option>
  <option value="තුනපහ කුඩු - Three Spice Blend">තුනපහ කුඩු — Three Spice Blend</option>
  <option value="බැදපු තුනපහ කුඩු - Roasted Three Spice Blend">බැදපු තුනපහ කුඩු — Roasted Three Spice Blend</option>
</select>

<label>Size / ප්‍රමාණය</label>

<select id="size">
  <option value="50g">50g</option>
  <option value="100g">100g</option>
  <option value="250g">250g</option>
  <option value="500g">500g</option>
</select>

<label>Quantity / ප්‍රමාණ ගණන</label>

<input type="number" id="quantity" value="1" min="1">

<button class="add-btn" onclick="addToCart()">
  + Add to Order
</button>

<div class="cart-box">

<h2>Your Order</h2>

<div id="cart">
  <p>No products added yet.</p>
</div>

</div>

<label>Your Name / නම</label>
<input type="text" id="name" placeholder="Enter your name">

<label>Phone Number / දුරකථන අංකය</label>
<input type="tel" id="phone" placeholder="Enter your phone number">

<label>Delivery Address / බෙදාහැරීමේ ලිපිනය</label>
<textarea id="address" placeholder="Enter your delivery address"></textarea>

<button class="whatsapp-btn" onclick="placeOrder()">
  📲 Place Order on WhatsApp
</button>

<a href="index.html" class="back-btn">
  ← Back to Products
</a>

</div>

<script>

let cart = [];

function addToCart() {

  const product = document.getElementById("product").value;
  const size = document.getElementById("size").value;
  const quantity = document.getElementById("quantity").value;

  if (!product) {
    alert("Please select a product.");
    return;
  }

  if (quantity < 1) {
    alert("Please enter a valid quantity.");
    return;
  }

  cart.push({
    product: product,
    size: size,
    quantity: quantity
  });

  displayCart();

  document.getElementById("product").value = "";
  document.getElementById("quantity").value = 1;
}

function displayCart() {

  const cartDiv = document.getElementById("cart");

  if (cart.length === 0) {
    cartDiv.innerHTML = "<p>No products added yet.</p>";
    return;
  }

  cartDiv.innerHTML = "";

  cart.forEach((item, index) => {

    const div = document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `
      <div>
        <strong>${item.product}</strong><br>
        Size: ${item.size} × ${item.quantity}
      </div>

      <button class="remove-btn" onclick="removeItem(${index})">
        Remove
      </button>
    `;

    cartDiv.appendChild(div);
  });
}

function removeItem(index) {

  cart.splice(index, 1);

  displayCart();
}

function placeOrder() {

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();

  if (cart.length === 0) {
    alert("Please add at least one product.");
    return;
  }

  if (!name || !phone || !address) {
    alert("Please fill in your name, phone number and delivery address.");
    return;
  }

  let message =
    "UDARASA SPICES PRODUCTS - NEW ORDER%0A%0A";

  cart.forEach((item, index) => {

    message +=
      (index + 1) + ". " +
      item.product +
      "%0A" +
      "Size: " + item.size +
      "%0A" +
      "Quantity: " + item.quantity +
      "%0A%0A";

  });

  message +=
    "Customer Name: " + encodeURIComponent(name) +
    "%0APhone: " + encodeURIComponent(phone) +
    "%0ADelivery Address: " + encodeURIComponent(address);

  window.location.href =
    "https://wa.me/94704112222?text=" + message;
}

</script>

</body>
</html>
